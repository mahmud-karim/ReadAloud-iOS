name: Build

# Builds the unsigned IPA. SideStore, AltStore or Sideloadly signs the app and its Safari extension
# when it is installed. No secrets and no signing identity are used.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  ipa:
    name: Unsigned IPA
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "::error::$DEVELOPER_DIR is missing. Installed:"; ls -d /Applications/Xcode*.app; exit 1
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Generate the Xcode project
        run: |
          command -v xcodegen >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate

      - name: Build for devices, unsigned
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild build \
            -project ReadAloud.xcodeproj -scheme ReadAloud -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee artifacts/xcodebuild.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" artifacts/xcodebuild.log

      - name: Show compile errors
        if: failure()
        run: grep -E -A5 "error:" artifacts/xcodebuild.log | head -120 || true

      - name: Check the Safari extension is inside
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/ReadAloud.app"
          appex="$app/PlugIns/ReadAloudExtension.appex"
          ls -la "$app" "$appex"
          for f in manifest.json content.js background.js popup.html popup.js settings.js icon-128.png; do
            [[ -f "$appex/$f" ]] || { echo "::error::$f is missing from the extension"; exit 1; }
          done
          plutil -p "$appex/Info.plist" | grep -E "NSExtensionPointIdentifier|NSExtensionPrincipalClass|CFBundleIdentifier"

      - name: Package the IPA
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/ReadAloud.app"
          mkdir -p "$RUNNER_TEMP/Package/Payload"
          ditto "$app" "$RUNNER_TEMP/Package/Payload/ReadAloud.app"
          (cd "$RUNNER_TEMP/Package" && zip -q -r -y -X "$GITHUB_WORKSPACE/artifacts/ReadAloud.ipa" Payload)
          ls -la artifacts

      - name: Publish to the Latest release
        # A fixed download link for the newest IPA from main, so it installs straight from Safari.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Newest build of main ($GITHUB_SHA). Install ReadAloud.ipa with SideStore or AltStore, not LiveContainer."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release create latest --title "Latest build" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload latest artifacts/ReadAloud.ipa --clobber

      - name: Upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: readaloud-ipa
          path: artifacts/
          retention-days: 14
