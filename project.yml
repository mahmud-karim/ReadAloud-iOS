# XcodeGen specification. The Xcode project is generated from this file (`xcodegen generate`) and is
# not committed. CI does this on a macOS runner; nothing here needs a Mac.
name: ReadAloud

options:
  minimumXcodeGenVersion: "2.42.0"
  bundleIdPrefix: com.mahmudkarim
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Unsigned: SideStore, AltStore or Sideloadly signs the app and its extension when it is installed.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  ReadAloud:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - target: ReadAloudExtension
        embed: true
        codeSign: false
    info:
      path: Generated/ReadAloud-Info.plist
      properties:
        CFBundleDisplayName: Read Aloud
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mahmudkarim.ReadAloud
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"

  ReadAloudExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
        excludes:
          - "Resources/**"
      # The web extension's files are copied flat into the extension bundle, next to manifest.json.
      - path: Extension/Resources
        buildPhase: resources
    info:
      path: Generated/ReadAloudExtension-Info.plist
      properties:
        CFBundleDisplayName: Read Aloud
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mahmudkarim.ReadAloud.Extension
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
